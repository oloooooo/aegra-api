# 本项目新增的配置（不属于 aegra 原生）。
# 逐键说明：docs/configuration.md §3.2
#
# 什么放这里：非密钥的项目参数（配额、会话文件上限、对象存储地址、知识空间、发件箱）。
# 什么不放这里：
#   - 密钥 -> .env（JWT_SECRET / PASSWORD_PEPPER / SESSION_SCOPE_SECRET / S3_ACCESS_KEY /
#     S3_SECRET_KEY / OPENAI_API_KEY）
#   - aegra 原生配置 -> aegra.json、src/aegra_api/settings.py（.env 里的 HOST/PORT/POSTGRES_* 等）
#
# 优先级：同名环境变量 > 本文件 > 代码内默认值（shared/config.py）。
# 改完要重启进程；值类型写错会直接启动失败。

# --- 配额（custom/service/quota.py，ADR-0012）---
quota:
  # 一个账号最多同时拥有几个会话（主管线程 + 子线程，子线程计到所属主管上）。
  # 超额时 POST /threads 返回 403；超管不受限。
  max_threads_per_user: 200

# --- 身份与 token（custom/service/account.py、custom/middleware/auth.py）---
auth:
  # 内部服务身份名：子 agent 线程的属主，鉴权中间件对它就免查库放行。
  # shared/token.py 与 graphs/access/spaces.py 共用这一个值，改了旧子线程属主就对不上。
  service_identity: subagent_service
  # 【只影响用户】access token 有效期（秒）。
  # 登录/注册签发的用户 token 用它；子 agent 的服务 token 写死 10 年，不受此值影响。
  access_token_ttl: 3600

# --- 会话文件 md（custom/service/session_files.py，ADR-0017）---
session_files:
  max_upload_mb: 10             # 单文件上限（POST /custom/uploads）
  max_files_per_session: 50     # 每会话 md 文件数（同名覆盖不占名额；xlsx 另有上限）

# --- 会话大表 xlsx（custom/service/session_files.py、graphs/tools/xlsx/，ADR-0015）---
xlsx:
  max_blob_mb: 10               # 单个 xlsx 的 HTTP 上限（与 md 的 max_upload_mb 分开）
  max_cells: 2000000            # 结构性硬闸，超了第一次调工具就报错
  max_xlsx_files_per_session: 20  # 同名覆盖不占名额
  max_blob_mb_per_user: 2048    # 每用户二进制总量（2GB）
  cache_dir: .cache/xlsx        # 索引与字节的本机缓存，必须在 okf.dir（knowledge/）之外
  cache_ttl_days: 7
  query_budget_ms: 5000         # 单次 where 查询的 CPU 预算，超了 interrupt()

# --- 对象存储（shared/session/blobs.py，ADR-0015/0017）---
# 凭证**不在这里**，写 .env：S3_ACCESS_KEY / S3_SECRET_KEY（密钥不进 git）。
s3:
  # 空 = 不启用对象存储：上传会话大表返回 503，其余功能不受影响。
  endpoint: ""
  bucket: aegra-blobs
  region: us-east-1

  # 【启用示例 1：本地 SeaweedFS】（起网关见 docs/S3.md §2）
  #   endpoint: http://127.0.0.1:8333
  #   .env:    S3_ACCESS_KEY=dev
  #            S3_SECRET_KEY=dev          # 未配 IAM 时任意值
  #   验证：   POST /custom/uploads/tables 应回 201；再用 docs/S3.md §6 的 list_objects_v2 看对象
  #
  # 【启用示例 2：真实 S3 / MinIO】
  #   endpoint: https://s3.us-east-1.amazonaws.com   # MinIO 填 http://host:9000
  #   bucket: 你的桶名
  #   region: us-east-1
  #   .env:    S3_ACCESS_KEY=AKIA…
  #            S3_SECRET_KEY=…
  #   最小权限：HeadBucket / CreateBucket / PutObject / GetObject / DeleteObject /
  #            ListBucket / AbortMultipartUpload / ListMultipartUploads
  #
  # 只想开关：把 endpoint 改回 "" 即退回纯磁盘（已上传的大表仍留在 S3，不影响读旧数据）。
  # 想让空间知识也进对象存储（不只会话大表）再加：
  #   okf:
  #     backend: s3fs           # 直读，不需要任何本地副本
  #   首次要把 knowledge/ 现有的内容传上去：scripts 里没有一键脚本了（镜像模式退役），
  #   用 aws s3 sync knowledge/ s3://aegra-blobs/okf/ 或 SeaweedFS 的 filer UI。

# --- 空间知识（shared/knowledge/{root,spec}.py，ADR-0017）---
okf:
  backend: local                # local = 直接读仓库根 <dir>；s3fs = 直读对象存储 okf/
  dir: knowledge                # 空间根目录名（相对仓库根；数据不在代码包里）

# --- 图（graphs/supervisor.py）---
agents:
  # supervisor 给 AsyncSubAgent 用的服务地址；容器/换端口时改这里。
  server_url: http://127.0.0.1:2026

# --- 任务结果发件箱（custom/service/outbox_dispatcher.py，ADR-0010）---
outbox:
  poll_interval_seconds: 1.0
  batch_size: 50
  lease_seconds: 30
  busy_backoff_seconds: 2
  max_attempts: 10
  startup_delay_seconds: 5
  summary_timeout_seconds: 5
  # 分发者读子线程用的自调地址；留空 = http://127.0.0.1:<PORT>（PORT 取 aegra 原生配置）
  internal_url: ""
